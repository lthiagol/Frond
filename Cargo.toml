[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/vault",
    "crates/app",
    "crates/testkit",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
regex = "1.13"
unicode-width = "0.2"
testkit = { path = "crates/testkit" }
